# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "gradle"
    directories:
      - /platform-catalog     # dependabot will look for build.gradle.kts and ./gradle/libs.versions.toml in this folder
      - /test-catalog         # dependabot will look for build.gradle.kts and ./gradle/libs.versions.toml in this folder
    schedule:
      interval: "monthly"
    exclude-paths:
      - build.gradle.kts     # exclude build files since dependencies live exclusively in the toml files
    target-branch: "develop"
    open-pull-requests-limit: 20
