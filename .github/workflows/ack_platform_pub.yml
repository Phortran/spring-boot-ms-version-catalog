name: Acknowledge incoming publication for Platform BOM

on:
  pull_request:
    paths:
      - 'platform-catalog/**'

permissions:
  issues: write
  pull-requests: write

jobs:
  example_comment_pr:
    runs-on: ubuntu-latest
    name: Add a comment to acknowledge publication
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Comment PR if platform BOM has changed
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            - [ ] I acknowledge that merging this PR is going to publish the `platform-catalog` BOM
                  and that I have updated the version number accordingly in `platform-catalog/build.gradle.kts`
          edit-mode: replace
